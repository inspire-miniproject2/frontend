name: Frontend CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

concurrency:
  group: frontend-dev-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::313984758699:role/GitHubActionsFrontendDeploy
  EC2_INSTANCE_ID: i-0f1208c667275ae51

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.short_sha }}
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "sha=$WORKFLOW_RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Resolve image coordinates
        id: image
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$owner/frontend" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_ENABLE_MOCKS=false
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 through SSM
        env:
          IMAGE: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          deploy_script_b64="$({
            cat <<'DEPLOY_SCRIPT'
            set -euo pipefail

            container="g-civil-frontend"
            network="g-civil-network"
            previous_image="$(docker inspect --format='{{.Config.Image}}' "$container" 2>/dev/null || true)"

            runuser -u ubuntu -- docker pull "$IMAGE"
            docker network inspect "$network" >/dev/null

            start_frontend() {
              local image="$1"
              docker run -d \
                --name "$container" \
                --restart unless-stopped \
                --network "$network" \
                --publish 80:80 \
                "$image"
            }

            restore_previous() {
              docker rm -f "$container" 2>/dev/null || true
              if [[ -n "$previous_image" ]]; then
                start_frontend "$previous_image"
              fi
            }

            docker rm -f "$container" 2>/dev/null || true
            if ! start_frontend "$IMAGE"; then
              restore_previous
              echo "Frontend failed to start; the previous image was restored."
              exit 1
            fi

            healthy=false
            for attempt in $(seq 1 20); do
              if docker exec "$container" wget --quiet --tries=1 --spider http://127.0.0.1/health; then
                healthy=true
                break
              fi
              sleep 3
            done

            if [[ "$healthy" != "true" ]]; then
              docker logs --tail=100 "$container" || true
              restore_previous
              echo "Frontend health check failed; the previous image was restored."
              exit 1
            fi

            docker image prune -f --filter "until=168h"
          DEPLOY_SCRIPT
          } | base64 -w 0)"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Frontend deployment ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters "commands=[\"echo '$deploy_script_b64' | base64 -d | IMAGE='$IMAGE' bash\"]" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $command_id"

          for attempt in $(seq 1 120); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "SSM deployment did not finish within 10 minutes."
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json || true
          exit 1

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Frontend dev deployment"
            echo
            echo "- Image: \`${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}\`"
            echo "- Target instance: \`${{ env.EC2_INSTANCE_ID }}\`"
            echo "- Transport: AWS Systems Manager Run Command"
          } >> "$GITHUB_STEP_SUMMARY"
