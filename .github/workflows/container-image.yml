name: Container Image

on:
  workflow_dispatch:

concurrency:
  group: container-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$owner/frontend" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_ENABLE_MOCKS=false
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Published frontend image"
            echo
            echo "- \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}\`"
            echo "- \`${{ steps.image.outputs.name }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
