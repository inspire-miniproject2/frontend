name: Frontend CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

concurrency:
  group: frontend-dev-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.short_sha }}
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "sha=$WORKFLOW_RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Resolve image coordinates
        id: image
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$owner/frontend" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_ENABLE_MOCKS=false
            VITE_API_BASE_URL=/api/v1
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: IMAGE,GHCR_USER,GHCR_READ_TOKEN
          command_timeout: 10m
          script: |
            set -euo pipefail

            container="g-civil-frontend"
            network="g-civil-network"
            previous_image="$(docker inspect --format='{{.Config.Image}}' "$container" 2>/dev/null || true)"

            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker network inspect "$network" >/dev/null

            start_frontend() {
              local image="$1"
              docker run -d \
                --name "$container" \
                --restart unless-stopped \
                --network "$network" \
                --publish 80:80 \
                "$image"
            }

            restore_previous() {
              docker rm -f "$container" 2>/dev/null || true
              if [[ -n "$previous_image" ]]; then
                start_frontend "$previous_image"
              fi
            }

            docker rm -f "$container" 2>/dev/null || true
            if ! start_frontend "$IMAGE"; then
              restore_previous
              echo "Frontend failed to start; the previous image was restored."
              exit 1
            fi

            healthy=false
            for attempt in $(seq 1 20); do
              if docker exec "$container" wget --quiet --tries=1 --spider http://127.0.0.1/health; then
                healthy=true
                break
              fi
              sleep 3
            done

            if [[ "$healthy" != "true" ]]; then
              docker logs --tail=100 "$container" || true
              restore_previous
              echo "Frontend health check failed; the previous image was restored."
              exit 1
            fi

            docker image prune -f --filter "until=168h"

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Frontend dev deployment"
            echo
            echo "- Image: \`${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}\`"
            echo "- Target: \`${{ secrets.EC2_HOST }}:80\`"
          } >> "$GITHUB_STEP_SUMMARY"
