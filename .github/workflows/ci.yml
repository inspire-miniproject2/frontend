name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate commit title
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --format='%s')"
          pattern='^\[(Add|Fix|Update|Remove|Refactor|Docs|Style|Setting)\]_[0-9]{2}/.+'

          if [[ ! "$subject" =~ $pattern ]]; then
            echo "Invalid commit title: $subject"
            echo "Expected: [작업유형]_날짜/파일명 또는 기능명"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        env:
          VITE_ENABLE_MOCKS: "false"
          VITE_API_BASE_URL: /api/v1
        run: pnpm build
